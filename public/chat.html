<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرشد - المحادثة الذكية</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="chat-body">

    <!-- Header الخاص بالمحادثة -->
    <header class="chat-header">
        <div class="chat-header-right">
            <a href="dashboard.html" class="back-arrow-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </a>
            <div class="bot-avatar">🤖</div>
            <div class="bot-info">
                <h2>مرشد</h2>
                <span class="status-indicator">متصل دابا</span>
            </div>
        </div>
    </header>

    <!-- منطقة رسائل المحادثة -->
    <main id="chatMessages" class="chat-messages">
        <!-- الرسائل كتحقن هنا ديناميكياً -->
    </main>

    <!-- شريط الإدخال في الأسفل -->
    <footer class="chat-footer">
        <div class="chat-input-container">
            <input type="text" id="userInput" placeholder="كتب سؤالك هنا..." autocomplete="off">
            <button id="sendBtn" class="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </div>
    </footer>

    <script src="js/chat.js"></script>
</body>
</html>
