<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرشد - المرشد الذكي</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. شاشة البداية (Splash Screen) -->
    <div id="splash-screen" class="splash-container">
        <div class="splash-dot" id="splashDot"></div>
        <div class="splash-content" id="splashContent">
            <h1 class="splash-title">مرشد</h1>
            <p class="splash-subtitle">المرشد الذكي ديالك 🎓</p>
        </div>
    </div>

    <!-- 2. شاشة الأسئلة (Onboarding Screen) -->
    <div id="onboarding-screen" class="onboarding-container hidden">
        <header class="onboarding-header">
            <button id="backBtn" class="back-btn hidden">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <button id="skipBtn" class="skip-btn">تخطي</button>
        </header>

        <main class="onboarding-main">
            <div id="stepContainer" class="step-container">
                <!-- يتم حقن خطوات الأسئلة هنا ديناميكياً عبر JavaScript -->
            </div>
        </main>

        <footer class="onboarding-footer">
            <button id="nextBtn" class="primary-btn" disabled>التالي</button>
        </footer>
    </div>

    <script src="js/splash.js"></script>
    <script src="js/onboarding.js"></script>
</body>
</html>
